services:
  - type: web
    name: lms-backend
    env: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    buildCommand: ""
    startCommand: "/app/lms_backend"
    envVars:
      - key: LMS_SERVER_HOST
        value: "0.0.0.0"
      - key: LMS_SERVER_PORT
        value: "8080"
      - key: LMS_DB_HOST
        fromSecret: DB_HOST
      - key: LMS_DB_PORT
        fromSecret: DB_PORT
      - key: LMS_DB_NAME
        fromSecret: DB_NAME
      - key: LMS_DB_USER
        fromSecret: DB_USER
      - key: LMS_DB_PASSWORD
        fromSecret: DB_PASSWORD
      - key: LMS_DB_SSLMODE
        value: "require"